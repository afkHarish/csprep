<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Code Compiler</title>
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Online Code Compiler</h1>
            <div class="timer">Time: <span id="timer">00:00</span></div>
        </header>

        <div class="question-section">
            <button id="randomQuestion">Get Random Question</button>
            <div id="questionDisplay" class="question-display">
                <h3>Question: <span id="questionTitle"></span></h3>
                <p id="questionDescription"></p>
                <p><strong>Example:</strong> <span id="questionExample"></span></p>
            </div>
        </div>

        <div class="editor-section">
            <div class="code-area">
                <div class="editor-header">
                    <h2>Code Editor</h2>
                    <select id="languageSelect" class="language-select">
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="c">C</option>
                    </select>
                </div>
                <div id="codeEditor"></div>
            </div>

            <div class="input-area">
                <h2>Input</h2>
                <textarea id="input" placeholder="Enter your input here (each line will be read as a separate input)"></textarea>
            </div>

            <button id="runCode">Run Code</button>

            <div class="output-area">
                <h2>Output</h2>
                <pre id="output"></pre>
            </div>
        </div>
    </div>

    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
